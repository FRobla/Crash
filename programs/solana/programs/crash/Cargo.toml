[package]
name = "crash"
version = "0.1.0"
description = "Crash settlement authority (docs/specs/crash-program.md)"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "crash"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"
crash-rules = { path = "../../crates/crash-rules" }
# Already in the dependency tree via anchor-lang; provides the SHA-256 syscall wrapper.
solana-sha256-hasher = "3.1.0"

[dev-dependencies]
# LiteSVM 0.17 runs Agave 4.3, matching the CLI toolchain; the 0.10 pinned by the Anchor template
# cannot load SBPF v3 programs built by platform-tools v1.54.
litesvm = "0.17.0"
solana-message = "4.2.4"
solana-transaction = "4.1.5"
solana-signer = "3.0.1"
solana-keypair = "3.1.2"
solana-transaction-error = "3.4.0"
solana-instruction-error = "2.5.0"
# Test-only Switchboard stand-in (never deployed) and the IDL conformance test.
switchboard-mock = { path = "../../test-programs/switchboard-mock", features = ["no-entrypoint"] }
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
